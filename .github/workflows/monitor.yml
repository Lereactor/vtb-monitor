name: vtb-monitor

# Official VTB Telegram channel only: t.me is blocked on the VPS.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Отправить тестовое сообщение"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vtb-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # latest state.json, not the trigger-time commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check sources
        run: python -m monitor.main --only channel  # detectors run on the VPS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test_message }}
      - name: Save state
        run: |
          git config user.name "vtb-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || { git commit -m "state: update" && git pull --rebase && git push; }
